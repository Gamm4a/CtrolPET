<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl + PET - Registro de sucursal</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        </style>
    <link rel="stylesheet" href="styles/styles.css">

</head>
<body>

    <main>
        <section class="formulario-registro-admin">

            <div class="contenedor-formulario-registro-admin" >
                <form class="formulario-reserva">
                    <div class="campo-formulario">
                        <label for="nombre">Nombre de la sucursal:</label>
                        <input type="text" id="nombre" placeholder="Ej. Centro" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="Ej. 6441234567" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="direccion">Dirección:</label>
                        <input type="tel" id="direccion" placeholder="Ej. Gatubela #2007,Centro" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="correo">Correo electrónico: </label>
                        <input type="email" id="correo" placeholder="Ej. sucursal@ctrlpet.com" >
                    </div>
                    <div class="campo-formulario">
                        <label for="correo-confirmar">Confirma tu correo electrónico: </label>
                        <input type="email" id="correo-confirmar" placeholder="Repite tu correo">
                    </div>
                    <div class="campo-formulario">
                        <label for="contrasenia">Contraseña: </label>
                        <input type="password" id="contrasenia" placeholder="***********">
                    </div> 
                    <div class="campo-formulario">
                        <label for="contrasenia-confirmar">Confirma tu contraseña: </label>
                        <input type="password" id="contrasenia-confirmar" placeholder="Repite tu contraseña" >
                    </div> 
                    <div class="button-tag">
                        <button type="submit" class="btn-registrar">Registrar sucursal</button>
                        <a href="login-admin.html">Regresar al inicio</a>
                    </div>
                    
                </form>
            </div>


        </section>

    </main>

    <footer>
        <p>&copy; Copyright Ctrl+PET 2026</p>
    </footer>
</body>
</html>
