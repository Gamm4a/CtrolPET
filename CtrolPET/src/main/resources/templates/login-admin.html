<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl + PET - Login</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        </style>
    <link rel="stylesheet" href="/styles/styles.css">

</head>
<body>
    <main>
        <section class="contenedor-inicio-sesion-admin">

            <div class="bienvenida-admin">
                <img src="/imgs/iconos/logo-dark.png">
                <h2>Panel Administrativo</h2>
                <h3>Gestiona citas y más...</h3>
            </div>

            <form class="formulario-login" th:action="@{/login-admin}" method="POST">

                <input type="radio" name="pasos" id="switch-login-paso1" checked>
                <input type="radio" name="pasos" id="switch-login-paso2">

                <h2>Bienvenido</h2>
                <p>Inicia sesión para continuar</p>

                <div class="selector-rol">
                    <a th:href="@{/login}">Soy Usuario</a>
                </div>

                <div id="paso1-login">
                    <div class="campo-formulario">
                        <label for="correo">Correo electrónico: </label>
                        <input type="email" name = "correo" id="correo" placeholder="Ej. luis.perez@gmail.com" >
                    </div>

                    <div class="button-tag">
                        <label for="switch-login-paso2" class="btn-continuar">Continuar</label>
                    </div>

                </div>
                
                <div id="paso2-login">
                    <div class="campo-formulario">
                    <label for="contrasenia">Contraseña: </label>
                    <input type="password" name="contrasenia" id="contrasenia" placeholder="***********">
                    </div> 
                    <div class="button-tag">
                        <button type="submit" class="btn-login">Iniciar Sesión</button>
                    </div>
                        
                </div>
                
            </form>
        </section>

        
    </main>
    <footer>
        <p>&copy; Copyright Ctrl+PET 2026</p>
    </footer>
</body>
</html>
