<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl + PET - Tabla de Dueños</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <main>
        <section class="contenedor-tabla">
            <div class="tag-rol">
                <span th:text="${empleado.puesto}">Rol activo</span>
            </div>
            <div class="encabezado-admin">
                <h1>Tabla de Dueños</h1>
                <a th:href="@{/admin}" class="btn-volver">Volver al Dashboard</a>
            </div>

            <div class="buscador-citas">
                <input type="text" name="buscar" placeholder="Buscar dueño">
            </div>

            <div class="area-tabla">
                <table class="tabla-citas-admin">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido Paterno</th>
                            <th>Apellido Materno</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Mascotas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dueno : ${listaDuenos}" tabindex="0">
                            <td th:text="${dueno.nombre}">Nombre</td>
                            <td th:text="${dueno.apellidoPaterno}">Apellido P.</td>
                            <td th:text="${dueno.apellidoMaterno}">Apellido M.</td>
                            <td th:text="${dueno.correo}">Correo</td>
                            <td th:text="${dueno.telefono}">Teléfono</td>
                            <td th:text="${dueno.mascotas != null ? dueno.mascotas.size() : 0}">0</td>
                            <td class="celda-accion">
                                <div class="opciones-citas">
                                    <a th:href="@{/admin/duenos/editar/{id}(id=${dueno.idDueno})}">Editar</a>
                                    <form th:action="@{/admin/duenos/eliminar/{id}(id=${dueno.idDueno})}" method="POST" onclick="return confirm('¿Seguro?')">
                                        <input type="hidden" name="_method" value="DELETE">
                                        <button type="submit" class="btn-eliminar">Eliminar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaDuenos)}">
                            <td colspan="6">No hay dueños registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; Copyright Ctrl+PET 2026</p>
    </footer>
</body>
</html>
