<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl + PET - Registro</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        </style>
    <link rel="stylesheet" href="../static/styles/styles.css">

</head>
<body>

    <header>
        <div class="logo">
            <img src="../static/imgs/iconos/logo.png" alt="logo de ctrl+PET.">
        </div>
        <nav class="header-nav">
            <a href="../templates/index.html">Inicio</a>
            <a href="../templates/servicios.html">Servicios</a>
            <a href="../templates/contacto.html">Contacto</a>
        </nav>
        <div class="botones-header">
            <a href="../templates/login.html" class="btn-login">Iniciar Sesión</a>
            <a href="../templates/registro.html" class="btn-register">Registrarse</a>
        </div>
    </header>

    <main>
        <section class="formulario-registro">
            <div class="contenedor-stepper">
                <div class="step-activo">
                    <div class="numero-step">1</div>
                    <div class="texto-step">
                    <strong>Tu Información</strong>
                    <span>Llena tus datos</span>
                    </div>
                </div>

                <div class="step">
                    <div class="numero-step">2</div>
                    <div class="texto-step">
                    <strong>Información de la mascota</strong>
                    <span>Cuéntanos de tu mejor amigo</span>
                    </div>
                </div>

                <div class="step">
                    <div class="numero-step">3</div>
                    <div class="texto-step">
                    <strong>Agendar cita</strong>
                    <span>Visítanos cuando quieras</span>
                    </div>
                </div>

                <div class="step">
                    <div class="numero-step">4</div>
                    <div class="texto-step">
                    <strong>Finalizar</strong>
                    <span>Bienvenido a la familia</span>
                    </div>
                </div>
            </div>
            <div class="contenedor-formulario-registro">
                <form class="formulario-reserva">
                    <div class="campo-formulario">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Ej. Luis Pérez" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="Ej. 6441234567" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="correo">Correo electrónico: </label>
                        <input type="email" id="correo" placeholder="Ej. luis.perez@gmail.com" >
                    </div>
                    <div class="campo-formulario">
                        <label for="correo-confirmar">Confirma tu correo electrónico: </label>
                        <input type="email" id="correo-confirmar" placeholder="Repite tu correo">
                    </div>
                    <div class="campo-formulario">
                        <label for="contrasenia">Contraseña: </label>
                        <input type="password" id="contrasenia" placeholder="***********">
                    </div> 
                    <div class="campo-formulario">
                        <label for="contrasenia-confirmar">Confirma tu contraseña: </label>
                        <input type="password" id="contrasenia-confirmar" placeholder="Repite tu contraseña" >
                    </div> 

                    

                </form>
            </div>
            <a href="#" class="btn-continuar">Continuar</a>

        </section>

    </main>

    <footer>
        <p>&copy; Copyright Ctrl+PET 2026</p>
    </footer>
</body>
</html>
